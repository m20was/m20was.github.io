name: Generate Pacman Contribution Graph

on:
  schedule:
    - cron: '0 0 * * *' # runs daily
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Generate Pacman Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          username: m20was
          output: output
